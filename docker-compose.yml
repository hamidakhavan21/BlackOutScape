services:
  api:
    build:
      context: .
      dockerfile: infra/docker/django/Dockerfile

    command: >
      sh -c "
      until nc -z db 5432;
      do
        echo 'Waiting for PostgreSQL...';
        sleep 1;
      done;

      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis


  worker:
    build:
      context: .
      dockerfile: infra/docker/django/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blackoutscape
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
